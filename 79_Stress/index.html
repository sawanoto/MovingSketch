<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#eeeadd"><title>MA-PAN 79 · STRESS</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <div class="title"><span>MA-PAN 79</span><strong>STRESS</strong></div>
  <div class="top-actions"><button id="languageButton" type="button" aria-label="Switch to English">EN</button><div id="legend" class="legend" aria-label="応力の色"><span>LOW</span><i></i><span>HIGH</span></div></div>
  <canvas id="stressCanvas" aria-label="左右のグリップを引いて、マーパン素材の応力集中を観察する作品"></canvas>
  <p id="hint" class="hint">左右のグリップを引く</p>
  <div id="pullButtons" class="pull-buttons" aria-label="引張操作"><button id="pullLeft" type="button">← HOLD</button><button id="pullRight" type="button">HOLD →</button></div>
  <nav id="specimens" class="specimens" aria-label="切れ込み形状"><button class="active" data-shape="none"><i class="sample none"></i><span>傷なし</span></button><button data-shape="hole"><i class="sample hole"></i><span>丸い穴</span></button><button data-shape="round"><i class="sample round"></i><span>丸い切り欠き</span></button><button data-shape="v"><i class="sample v"></i><span>鋭いV字</span></button></nav>
  <button id="reset" type="button">RESET</button>
</main><script src="sketch.js"></script></body></html>
