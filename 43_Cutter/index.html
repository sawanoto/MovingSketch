<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eeeae3">
  <meta name="description" content="線を引くと、マーパンがぷるんと分裂してむにゅっと戻るインタラクティブ作品。">
  <title>マーパンカッター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="series">MARPAN PLAY LAB / 43</p>
      <h1>マーパンカッター</h1>
    </header>
    <section id="stage" aria-label="マーパンをスワイプして切る遊び場">
      <div id="canvasHost"></div>
      <div class="hint" id="hint">マーパンを シュッ と切ってみよう</div>
      <button id="sound" type="button" aria-pressed="true" aria-label="音を切り替える">♪ ON</button>
      <div id="debug" hidden></div>
    </section>
    <p class="help">ドラッグ / スワイプで切る　<span>線が横切ったマーパンはすべて分裂・最大16体</span></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="../shared/marpan-25d.js"></script>
  <script src="game.js"></script>
</body>
</html>
