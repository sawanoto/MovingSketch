<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#d9f1ed">
  <title>魚マーパンの水槽</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="i18n.css">
  <script src="vendor/p5.min.js"></script>
</head>
<body>
  <header>
    <div><p class="eyebrow">MARPAN AQUARIUM / 35</p><h1 data-i18n="title">魚マーパンの水槽</h1></div>
    <div class="header-stats">
      <span><span data-i18n="points">おんぷ</span> <b id="points">0</b></span>
      <button id="lang-toggle" class="soft lang-toggle" type="button" aria-label="Switch to English" aria-pressed="false">EN</button>
      <button id="shop-open" class="soft" type="button">SHOP</button>
    </div>
  </header>
  <main>
    <section class="aquarium-card">
      <div class="tank-top">
        <div><span class="eyebrow">WATER QUALITY</span><div class="quality"><i id="quality-bar"></i></div></div>
        <strong id="quality-label">きれい</strong>
      </div>
      <div id="canvas-wrap" data-i18n-aria="tankAria" aria-label="魚マーパンの水槽"></div>
      <div class="care-bar">
        <button id="water-change" type="button"><span data-i18n="changeWater">水替え</span> <small id="conditioner-count">カルキ抜き ×1</small></button>
        <span class="care-hint" data-i18n="careHint">苔は水槽をこすって、休符はタップしてお掃除</span>
      </div>
    </section>
    <section class="piano-card">
      <div><p class="eyebrow">SOUND FOOD</p><h2 data-i18n="feedTitle">音をあげる</h2><p data-i18n="feedHelp">鍵盤を弾くと、音符が水の中へ泳いでいきます。</p></div>
      <div id="piano" class="piano" data-i18n-aria="pianoAria" aria-label="音符の鍵盤"></div>
    </section>
  </main>
  <dialog id="shop">
    <form method="dialog" class="shop-head"><div><p class="eyebrow">AQUARIUM SHOP</p><h2 data-i18n="shopTitle">水槽のおみせ</h2></div><button class="close" data-i18n-aria="closeAria" aria-label="閉じる">×</button></form>
    <p class="shop-points"><span data-i18n="spendable">使えるおんぷ</span> <b id="shop-points">0</b></p>
    <div id="shop-grid" class="shop-grid"></div>
  </dialog>
  <div id="toast" aria-live="polite"></div>
  <script src="sketch.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
