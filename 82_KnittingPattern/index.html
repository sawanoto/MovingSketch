<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="1マス1目。段数と目数を音階に変えて、描いた模様を編み図とメロディーにするマーパン編み図メーカー。">
  <title>マーパン編み図メーカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="title-block">
        <span>SOUNDSKETCH 82</span>
        <h1>マーパン編み図メーカー</h1>
      </div>
      <div class="actions" aria-label="編み図の操作">
        <label class="size-label">サイズ
          <select id="grid-size" aria-label="編み図のサイズ">
            <option value="20">20 × 20</option>
            <option value="30" selected>30 × 30</option>
            <option value="40">40 × 40</option>
            <option value="50">50 × 50</option>
          </select>
        </label>
        <button id="sample" type="button">マーパン</button>
        <button id="chart-mode" type="button" aria-pressed="false">編み図</button>
        <button id="reset" type="button">リセット</button>
        <button id="play" class="play" type="button">演奏してみる</button>
      </div>
    </header>

    <section id="palette" aria-label="毛糸カラー"></section>
    <div id="sketch" aria-label="編み図を描く方眼"></div>

    <footer>
      <span id="status" aria-live="polite">毛糸を選んで、目を塗る</span>
      <span class="rule">1マス = 1目　／　段数＋目数 = 音階</span>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
