<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#100c1b">
  <title>マーパン・ラバランプ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <header>
    <p>MARPAN LAVA LAMP / 39</p>
    <h1>マーパン・ラバランプ</h1>
  </header>

  <button class="control-toggle" id="controlToggle" type="button" aria-expanded="false" aria-controls="controls">調整</button>
  <aside class="controls" id="controls" aria-label="ランプの調整">
    <label><span>熱源</span><output id="heatValue">65</output><input id="heat" type="range" min="25" max="100" value="65"></label>
    <label><span>くびれ</span><output id="countValue">2</output><input id="count" type="range" min="1" max="3" value="2" step="1"></label>
    <label><span>流れ</span><output id="speedValue">1.0</output><input id="speed" type="range" min="50" max="160" value="100"></label>
  </aside>

  <p class="caption">あたためられて、浮かんで、また戻る。</p>
  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
