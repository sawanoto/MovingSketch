<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e8f1f0">
  <meta name="description" content="マーパンを船へ積み、船体の形・浮力・積載量・重量配分を体験するインタラクティブ作品">
  <title>MA-PAN SHIP LAB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><h1>MA-PAN SHIP LAB</h1><p id="ship-note">水を押しのけて、浮かぶ</p></div>
      <button id="reset" type="button">RESET</button>
    </header>
    <nav id="ship-picker" aria-label="船を選ぶ"></nav>
    <div id="sketch" aria-label="船の浮力実験"></div>
    <aside id="readout" aria-live="polite">
      <div><span>積載重量</span><b id="load-value">0 / 12</b></div>
      <div><span>喫水</span><b id="draft-value">0.5 m</b></div>
      <div><span>安定性</span><b id="stability-value">安定</b></div>
    </aside>
    <p id="hint">マーパンをつかんで、船の好きな場所へ</p>
    <p id="message" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
