<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4ee">
  <title>マーパンのメロディヒル — きらきら星</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eaf4ee; }
    body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    canvas { display: block; touch-action: none; }
    button { font: inherit; }
    #controls { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: end; padding: 0 18px; pointer-events: none; }
    .drive { width: min(24vw, 112px); height: min(18vw, 76px); border: 1px solid rgba(40,61,54,.18); border-radius: 22px; background: rgba(255,255,255,.84); color: #29463d; font-size: 30px; box-shadow: 0 8px 24px rgba(42,70,60,.12); backdrop-filter: blur(8px); pointer-events: auto; touch-action: none; user-select: none; }
    .drive:active, .drive.active { transform: translateY(2px); background: #fff5c8; }
    #jumpBtn { width: min(32vw, 144px); height: min(18vw, 72px); border-radius: 999px; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
    #directions { display: flex; gap: 10px; pointer-events: none; }
    #directions .drive { width: min(19vw, 88px); pointer-events: auto; }
    @media (hover: hover) and (pointer: fine) { #controls { opacity: .34; } .drive { width: 72px; height: 54px; font-size: 22px; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="shared/marpan-25d.js"></script>
</head>
<body>
  <div id="controls" aria-label="移動操作">
    <button class="drive" id="jumpBtn" aria-label="ジャンプ">JUMP</button>
    <div id="directions">
      <button class="drive" id="leftBtn" aria-label="ブレーキ、後退">←</button>
      <button class="drive" id="rightBtn" aria-label="前進、加速">→</button>
    </div>
  </div>
  <script src="sketch.js?v=10"></script>
</body>
</html>
