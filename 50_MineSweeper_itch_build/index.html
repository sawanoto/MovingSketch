<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf4f4">
  <meta name="description" content="地雷の連鎖からきらきら星が生まれ、盤面を囲むマーパンへ音楽があふれ出すマインスイーパー。">
  <title>マーパンマインスイーパー</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell">
  <header><a class="back" href="../" id="back" aria-label="作品一覧へ">←</a><p class="eyebrow">50 / MA-PAN MINESWEEPER</p><div class="header-actions"><button id="language" class="small-button language" aria-label="Switch to English">EN</button><button id="sound" class="small-button" aria-pressed="true">音 ON</button></div></header>
  <div class="title"><span aria-hidden="true">✧</span><h1><span data-copy="titleTop">マーパン</span><br><strong data-copy="titleMain">マインスイーパー</strong></h1><span aria-hidden="true">✦</span></div>
  <p class="subtitle" data-copy="subtitle">ひとつの「ポン」から、きらきら星。</p>
  <section id="stageSelect" class="stage-select" aria-labelledby="stageTitle">
    <p class="select-kicker">MUSIC GARDEN</p>
    <h2 id="stageTitle" data-copy="selectTitle">ステージを選択</h2>
    <p class="select-lead" data-copy="selectLead">庭が広いほど、音楽は深くかくれています。</p>
    <div id="stageCards" class="stage-cards"></div>
  </section>
  <section id="gameArea" hidden>
  <div class="game-nav"><button id="stageBack" class="text-button">← <span data-copy="stages">ステージ選択</span></button><span id="stageName"></span></div>
  <section class="garden" id="garden" aria-label="音楽の地雷原">
    <div class="board-toolbar"><div><span class="mini-label" id="counterLabel">地雷 − ♪ マーク</span><strong id="remaining">12 <small>/ 12</small></strong></div><button class="small-button" id="restart">↻ はじめから</button></div>
    <div class="music-stage" id="musicStage">
      <div class="orbit" aria-hidden="true"></div>
      <div id="board" class="board" role="group" aria-label="8行8列の盤面"></div>
      <div id="characters" role="img" aria-label="盤面を囲んで待つ30体のマーパン。連鎖すると時計回りに演奏します。"></div>
    </div>
    <div class="garden-bottom"><span>数字 ＝ まわり8マスの地雷の数</span><span id="safeCount">安全 0 / 52</span></div>
  </section>
  <div class="status-area"><p id="status" role="status">数字をたよりに、安全なマスをひらこう。</p><div id="resultActions" class="result-actions" hidden><button id="again" class="again">もういちど</button><button id="selectAgain" class="again secondary">ステージ選択へ</button></div></div>
  <p class="guide" data-copy="guide">タップでひらく · 長押し / 右クリックで ♪ マーク</p>
  </section>
  <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
</main>
<script src="vendor/p5.min.js"></script>
<script src="vendor/marpan-25d.js"></script>
<script src="vendor/marpan-sound.js"></script>
<script src="melody.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
