<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dce9df">
  <title>マーパン観察記 / Maapan Stories</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <main id="game">
    <header class="topbar">
      <div><p class="eyebrow">MAAPAN STORIES / 40</p><h1>マーパン観察記</h1></div>
      <div class="clock"><span id="dayLabel">第1日</span><strong id="timeLabel">朝 06:00</strong></div>
      <div class="speed" aria-label="再生速度">
        <button data-speed="1" class="active">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><button data-speed="0">停止</button>
      </div>
    </header>

    <section class="world" aria-label="マーパンたちの暮らす草地">
      <div id="canvas-wrap"></div>
      <p class="hint">マーパンを選ぶと、頭の中をのぞけます</p>
      <section class="seed-picker" id="seedPicker" aria-labelledby="seedQuestion">
        <p class="seed-day" id="seedDay">第1日</p>
        <h2 id="seedQuestion">今日は世界に何を起こしますか？</h2>
        <div class="seed-options" id="seedOptions"></div>
        <p class="seed-description" id="seedDescription">選ばなくても「何もしない」で自動的に始まります。</p>
        <button class="watch-day" id="watchDay" disabled>この一日を見る</button>
      </section>
      <div class="day-progress" id="dayProgress" aria-hidden="true"><i></i><span>マーパンたちが答えを出しています</span></div>
    </section>

    <aside class="sidepanel">
      <div class="tabs" role="tablist">
        <button data-tab="today" class="active">今日</button><button data-tab="maapans">3匹</button><button data-tab="relations">関係</button><button data-tab="history">歴史</button>
      </div>
      <section id="today" class="panel active"><h2>今日のできごと</h2><div id="eventLog" class="event-log"></div></section>
      <section id="maapans" class="panel"><h2>マーパン一覧</h2><div id="marpanList"></div></section>
      <section id="relations" class="panel"><h2>いまの距離</h2><div id="relationList"></div><p class="small">数値ではなく、暮らしに見える関係を記しています。</p></section>
      <section id="history" class="panel"><h2>この世界の歴史</h2><div id="historyList"></div></section>
    </aside>
  </main>

  <dialog id="mindDialog"><button class="close" aria-label="閉じる">×</button><div id="mindContent"></div></dialog>
  <dialog id="storyDialog" class="story"><button class="close" aria-label="閉じる">×</button><p class="eyebrow">TODAY'S OBSERVATION</p><div id="storyContent"></div></dialog>

  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
