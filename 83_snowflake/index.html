<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050b16">
  <meta name="description" content="音を鳴らしながら、中心から静かに育つ雪の結晶を観察するインタラクティブ作品。">
  <title>雪花 — Snow Crystal No.83</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="series">MAR-PAN / SOUND SKETCH 83</p>
      <h1>雪花 <span>SNOW CRYSTAL</span></h1>
    </header>

    <canvas id="snow" aria-label="成長する雪の結晶"></canvas>

    <section class="guide" aria-live="polite">
      <p id="status">結晶核にふれてください</p>
      <div class="rule"><i></i><span>枝が生まれるほど、音は高くなる</span><i></i></div>
    </section>

    <nav id="patterns" aria-label="結晶の形を選ぶ"></nav>

    <div class="top-actions">
      <button id="language" type="button" aria-label="Switch to English">EN</button>
      <button id="sound" type="button" aria-label="音を消す" aria-pressed="true">
        <span class="sound-bars"><i></i><i></i><i></i></span><span class="sound-label">SOUND</span>
      </button>
    </div>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
