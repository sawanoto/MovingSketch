<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#dff7ff">
  <title>アイスクラッシュ</title>
  <link rel="stylesheet" href="style.css">
  <script src="p5.min.js"></script>
</head>
<body>
  <main id="game" aria-label="氷をタップして、中にいるキャラクターを見つけるゲーム">
    <div id="canvas-wrap"></div>
    <div id="top-guide" aria-hidden="true"><b>こおりを タップ！</b><small>＋ で しゃしんも はいります</small></div>
    <button id="reset-photos" aria-label="追加した写真をリセット" title="追加した写真をリセット"><span>↺</span><small>しゃしん</small></button>
    <label id="photo-button" aria-label="写真を追加">
      <span>＋</span>
      <input id="image-input" type="file" accept="image/*" multiple>
    </label>
    <button id="again-button" aria-label="もう一回遊ぶ"><span>↻</span><small>もういっかい</small></button>
    <div id="tap-hint" aria-hidden="true"><span>☝</span><i></i></div>
  </main>

  <script src="marpan-25d.js"></script>
  <script src="family-marpan.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
