<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#01040a">
  <meta name="description" content="太陽系の6つの惑星そのものが三つ目のマーパンになった、触れて眺める宇宙作品。">
  <title>UNIVERSE MA-PAN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="universe" aria-label="水星から土星まで、宇宙に浮かぶ六体の惑星マーパン"></canvas>
    <header class="title" aria-hidden="true">
      <span>UNIVERSE</span>
      <small>MA-PAN</small>
    </header>
    <p class="hint" id="hint">惑星にふれる</p>
    <output class="planet-name" id="planet-name" aria-live="polite"></output>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
