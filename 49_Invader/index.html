<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102b3a">
  <meta name="description" content="敵を倒した音がメロディーになるマーパンの音楽シューティングゲーム">
  <title>マーパン・ミュージックインベーダー</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="piano.css">
  <link rel="stylesheet" href="space-menu.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <main id="gameShell">
    <a class="back" href="../" aria-label="作品一覧へ戻る">←</a>
    <section class="screen menu" id="menuScreen">
      <p class="eyebrow">49 / MUSIC INVADER</p>
      <h1>マーパン・<br>ミュージックインベーダー</h1>
      <p class="concept">音を当てて、メロディーを見つけよう。</p>
      <div class="songs" id="songList"></div>
      <p class="controls">← → 移動　　A S D F G H J K ワープ　　SPACE 音符を送る</p>
    </section>
    <section class="screen result" id="resultScreen" hidden>
      <p class="eyebrow">PERFORMANCE COMPLETE</p>
      <h2 id="resultTitle">演奏がおわりました</h2>
      <p id="resultText"></p>
      <div><button id="retryButton" type="button">もう一度</button><button id="menuButton" type="button">曲を選ぶ</button></div>
    </section>
    <div class="hud" id="hud" hidden>
      <strong id="songTitle"></strong>
      <span id="progressText"></span>
    </div>
    <section class="piano" id="piano" aria-label="音階レーンへワープする鍵盤" hidden></section>
    <p class="gameGuide" id="gameGuide" hidden>← → 移動　 A–K ワープ　 SPACE ♪</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
