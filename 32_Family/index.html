<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#f7efe5">
<title>マーパンファミリー・キャラクターカタログ</title><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script><script src="../shared/marpan-25d.js"></script><script src="family-marpan.js"></script></head>
<body><header class="toolbar"><div><p class="eyebrow">MARPAN FAMILY / 32</p><h1>マーパンファミリー</h1></div><div class="toolbar__group">
<label>表示<select id="view-mode"><option value="catalog">キャラクター一覧</option><option value="size">サイズ比較</option></select></label>
<label>対象<select id="member-select"></select></label></div></header><main>
<section class="controls" aria-label="マーパンの操作"><div class="control-block"><span class="control-label">表情</span><div id="expression-buttons" class="button-row"></div></div>
<div class="control-block"><span class="control-label">視線</span><div id="yaw-buttons" class="button-row"><button type="button" data-yaw="-0.48">左</button><button type="button" data-yaw="0" class="is-active">正面</button><button type="button" data-yaw="0.48">右</button></div></div>
<button type="button" id="all-expression" class="accent-button">全員をこの表情にする</button></section><div id="current-label" class="current-label" aria-live="polite"></div><div id="canvas-wrap"></div></main>
<script src="sketch.js?v=2"></script></body></html>
