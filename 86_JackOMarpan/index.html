<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b21">
  <meta name="description" content="音符のお菓子を食べたジャック・オ・マーパンが、8つの音をメロディーにして返すインタラクティブ作品。">
  <title>Jack-o'-Marpan — Trick or Note</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Jack-o'-Marpan。周りの音符のお菓子を選んでメロディーを作る作品です。">
    <header>
      <p class="series">MAR-PAN SERIES 86</p>
      <h1>Jack-o'-Marpan</h1>
      <p class="tagline">TRICK OR NOTE</p>
    </header>
    <canvas id="stage" aria-label="音符のお菓子をタップしてジャックオランタンマーパンに食べさせてください"></canvas>
    <button id="sound" type="button" aria-label="音を切り替える" aria-pressed="true">♪</button>
    <p id="hint">tap a candy</p>
    <p id="live" class="visually-hidden" aria-live="polite"></p>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
