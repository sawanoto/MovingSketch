<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <title>マーパン・フェイシャル｜表情カタログ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <section class="face-picker" aria-label="表情を選ぶ">
    <div class="face-picker__heading">
      <strong>FACIAL</strong>
      <span id="current-face">F01　大笑い</span>
    </div>
    <div class="view-picker" aria-label="顔の向きを選ぶ">
      <span>向き</span>
      <button class="view-button" data-yaw="-0.82" type="button">左向き</button>
      <button class="view-button is-active" data-yaw="0" type="button">正面</button>
      <button class="view-button" data-yaw="0.82" type="button">右向き</button>
    </div>
    <div class="color-picker" aria-label="体の色を選ぶ" id="color-buttons">
      <span>色</span>
    </div>
    <div class="face-picker__buttons" id="face-buttons"></div>
  </section>
  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
