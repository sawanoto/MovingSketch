<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5efe2">
  <meta name="description" content="マーパンを載せて、橋の構造による力の伝わり方を体験するインタラクティブ作品">
  <title>MA-PAN BRIDGE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div><h1>MA-PAN BRIDGE</h1><p id="bridge-name">桁橋 <span>まっすぐ、じっと支える</span></p></div>
      <nav aria-label="橋の種類">
        <button class="bridge-button active" data-bridge="beam">桁橋</button>
        <button class="bridge-button" data-bridge="truss">トラス橋</button>
        <button class="bridge-button" data-bridge="arch">アーチ橋</button>
        <button class="bridge-button" data-bridge="cable">斜張橋</button>
        <button class="bridge-button" data-bridge="throughArch">スルーアーチ橋</button>
        <button class="bridge-button" data-bridge="warren">ワーレントラス橋</button>
        <button class="bridge-button" data-bridge="frame">ラーメン橋</button>
        <button class="bridge-button" data-bridge="cantilever">カンチレバー橋</button>
      </nav>
      <button id="reset" type="button" aria-label="配置をリセット">RESET</button>
    </header>
    <div id="sketch" aria-label="橋の実験場"></div>
    <p id="hint">下のマーパンを、橋の好きなところへ</p>
    <div id="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
