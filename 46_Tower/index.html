<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b8dff0">
<meta name="description" content="マーパンを積み、塔を下から上へ演奏する物理音楽ゲーム"><link rel="icon" href="data:,"><title>MA-PAN TOWER</title><link rel="stylesheet" href="style.css"><style>.rotate{bottom:20px}.icon-button{bottom:27px}.songs{display:grid;grid-template-columns:repeat(4,minmax(132px,1fr));gap:9px;width:min(650px,94vw)}.song{min-width:0;padding:12px 10px}.song b{font-size:14px}.song.is-locked{color:rgba(23,54,75,.48);background:rgba(225,235,234,.52);cursor:not-allowed}.song:disabled{opacity:.72}.compose-song{grid-column:1/-1}.note-picker{position:absolute;z-index:5;top:82px;right:14px;display:none;grid-template-columns:repeat(4,38px);gap:7px;padding:9px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,242,.78);box-shadow:0 5px 16px rgba(23,54,75,.1);backdrop-filter:blur(8px)}.note-picker.show{display:grid}.note-picker button{width:38px;height:38px;padding:0;border:3px solid transparent;border-radius:50%;background:var(--note-color);color:#17364b;font-size:11px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(23,54,75,.28)}.note-picker button.is-selected{border-color:#fff;outline:3px solid #17364b;transform:scale(1.08)}@media(max-width:650px){.start-screen{justify-content:flex-start;overflow-y:auto;padding-top:24px}.start-marpan{width:105px;height:69px;flex:0 0 auto}.start-marpan i{top:24px;transform:scale(.82)}.start-screen>p{margin-top:12px}.start-screen h1{margin-bottom:14px;font-size:32px}.songs{grid-template-columns:repeat(2,minmax(0,1fr));width:min(350px,94vw)}.start{margin-bottom:22px}.note-picker{top:76px;right:8px;grid-template-columns:repeat(4,34px);gap:6px;padding:8px}.note-picker button{width:34px;height:34px}}</style>
</head><body><main class="game-shell">
<canvas id="game" aria-label="マーパンを積むゲーム"></canvas>
<a class="back" href="../" aria-label="戻る">←</a>
<div class="next"><span>NEXT</span><canvas id="nextCanvas" width="84" height="68"></canvas></div>
<div class="note-picker" id="notePicker" aria-label="マーパンの色と音を選ぶ"></div>
<button class="icon-button play" id="playButton" type="button" aria-label="塔を演奏">♪</button>
<button class="rotate" id="rotateButton" type="button" aria-label="マーパンを回転">↻</button>
<section class="start-screen" id="startScreen">
 <div class="start-marpan" aria-hidden="true"><i></i><i></i><i></i></div><p>MA-PAN TOWER</p><h1>音を積もう</h1>
 <div class="songs" id="songList" role="group" aria-label="遊ぶ曲を選ぶ"></div>
 <button class="start" id="startButton" type="button">この曲で遊ぶ</button>
</section>
<section class="result" id="result" aria-live="polite"><h2 id="resultTitle">GAME OVER</h2><p id="resultCopy"></p><div><button id="retryButton" type="button">もう一度</button><button id="menuButton" type="button">曲を選ぶ</button></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script src="game.js?v=16"></script></body></html>
