<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#eee9dc">
  <meta name="description" content="マーパンを載せ、建築構造を流れる力と崩れ方を観察するインタラクティブ作品">
  <title>MA-PAN 80 — BUILDING</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="brand"><span>MA-PAN 80</span><h1>BUILDING</h1></div>
    <nav aria-label="建築技術の発展順">
      <button class="type active" data-type="mass">厚い石壁</button>
      <button class="type" data-type="vault">アーチ＋ヴォールト</button>
      <button class="type" data-type="buttress">バットレス</button>
      <button class="type" data-type="flying">フライングバットレス</button>
    </nav>
    <button id="reset" type="button">RESET</button>
  </header>
  <section id="controls" aria-label="建物の寸法">
    <label>高さ<input id="height" type="range" min="0" max="100" value="58"></label>
    <label>建物全体の幅<input id="span" type="range" min="0" max="100" value="52"></label>
    <label>壁の厚さ<input id="thickness" type="range" min="0" max="100" value="58"></label>
    <button id="support" type="button" aria-pressed="true"><i></i><span>飛梁 ON</span></button>
    <button id="force" type="button" aria-pressed="false"><i></i><span>力を見る</span></button>
  </section>
  <div id="sketch" aria-label="マーパン建築構造実験場"></div>
  <p id="hint">下のマーパンを屋根へドラッグ</p>
  <div id="message" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
<script src="../shared/marpan-25d.js"></script>
<script src="sketch.js"></script>
</body>
</html>
