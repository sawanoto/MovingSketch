<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f3efe4">
  <meta name="description" content="日本語の文字がつながり、ひとつの生きた紋様になるインタラクティブ・カリグラフィー作品。">
  <title>文字は、ひとつになる。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="title-block">
        <p class="series">MA-PAN STUDY 68</p>
        <h1>文字は、ひとつになる。</h1>
      </div>
      <button id="sound" class="icon-button" type="button" aria-label="音を切り替える" aria-pressed="true">音　あり</button>
    </header>

    <nav class="modes" aria-label="構図を選ぶ">
      <button class="mode active" data-mode="circle">円形</button>
      <button class="mode" data-mode="vertical">縦長</button>
      <button class="mode" data-mode="symmetry">左右対称</button>
      <button class="mode" data-mode="free">自由形</button>
    </nav>

    <section id="stage" aria-label="日本語カリグラフィー。文字を押すと線がつながります">
      <canvas id="art"></canvas>
      <div id="instruction">
        <span class="finger">◯</span>
        <span>一度触れて、形をひらく</span>
      </div>
    </section>

    <footer>
      <div class="progress-wrap" aria-label="作品の完成度">
        <div id="progress"></div>
      </div>
      <p id="reading" aria-live="polite">い　き　る　し　ず　け　さ</p>
      <button id="reset" type="button">ほどく</button>
    </footer>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
