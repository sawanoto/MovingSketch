<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="description" content="歩いた道が旋律になる、マーパンの音楽迷路。">
  <title>MA-PAN MELODY MAZE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">MA-PAN 72</p>
        <h1>MELODY MAZE</h1>
        <p id="song-label" class="song-label">SELECT A SONG</p>
      </div>
      <div class="actions">
        <button id="songs" type="button">SONGS</button>
        <button id="sound" type="button" aria-pressed="true" aria-label="音のオン・オフ">♪</button>
        <button id="reset" type="button">RESET</button>
      </div>
    </header>

    <section id="stage" aria-label="音楽の迷路">
      <div id="sketch"></div>
      <div id="stage-select" class="card stage-select">
        <div class="select-heading">
          <p>曲を選ぶ</p>
          <small>SELECT A SONG</small>
        </div>
        <div id="song-grid" class="song-grid"></div>
      </div>
      <div id="complete" class="card" hidden>
        <p>この道は「きらきら星」でした。</p>
        <div id="complete-melody" class="melody"></div>
        <div class="complete-actions"><button id="again" type="button">もう一度</button><button id="choose-song" type="button">曲を選ぶ</button></div>
      </div>
    </section>

    <footer>
      <p id="hint">矢印キー / WASD / 通路をクリック</p>
      <div class="pad" aria-label="タッチ操作">
        <button data-dir="up" aria-label="上">↑</button>
        <button data-dir="left" aria-label="左">←</button>
        <button data-dir="down" aria-label="下">↓</button>
        <button data-dir="right" aria-label="右">→</button>
      </div>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="../shared/marpan-25d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
