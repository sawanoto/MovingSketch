<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f3eee5">
  <title>MAR-PAN CATCHER — おんがくでうごくUFOキャッチャー</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <a href="../" class="back" aria-label="作品一覧へ">←</a>
      <div class="brand"><span>81 / MAR-PAN CATCHER</span><h1>おんがくで、つかまえる。</h1></div>
      <div class="status"><span id="plays">PLAY 01</span><span id="getCount">GET 0</span></div>
    </header>

    <section class="machine-wrap">
      <canvas id="game" width="1200" height="720" aria-label="マーパンUFOキャッチャー"></canvas>
      <div id="judge" class="judge" aria-live="polite"></div>
    </section>

    <section class="controls">
      <div class="beat-ui" id="beatUI">
        <div class="beat-label"><b id="beatTitle">好きな音からスタート</b><span id="beatHint">ビートに合わせると大きく奥へ</span></div>
        <div class="melody-track" id="pulseTrack"></div>
      </div>
      <div class="instruction" id="instruction"><b>おてほん ♪ ド ド ソ ソ ラ ラ ソ｜ファ ファ ミ ミ レ レ ド</b><span>同じ音の連続でも、自由なメロディーでもOK</span></div>
      <div class="keys" id="keys" aria-label="8つの音階鍵盤"></div>
      <div class="history-row"><span>PLAYED</span><div id="history" class="history"></div><button id="reset" type="button">RESET</button></div>
    </section>

    <section class="collection"><span>MY MAR-PAN</span><div id="collectionItems"><i>まだ空っぽ</i></div></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
